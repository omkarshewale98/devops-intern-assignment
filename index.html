<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Demo Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    section {
      padding: 2rem;
      text-align: center;
    }
    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: auto;
    }
    button {
      background-color: #ff6f61;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #e85c50;
    }
    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My DevOps Demo</h1>
  </header>

  <section>
    <h2>Continuous Deployment in Action</h2>
    <p>This page was deployed automatically to an Azure VM using GitHub Actions. Every push to <strong>main</strong> updates this site within minutes.</p>
    <button onclick="alert('Deployment successful!')">Test Button</button>
  </section>

  <footer>
    <p>&copy; 2026 DevOps Demo</p>
  </footer>
</body>
</html>
