<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My DevOps Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
      text-align: center;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 1rem;
    }
    h1 {
      margin: 0;
    }
    section {
      padding: 2rem;
    }
    button {
      background-color: #ff6f61;
      border: none;
      padding: 10px 20px;
      color: #fff;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #e85c50;
    }
    footer {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My DevOps Demo</h1>
  </header>

  <section>
    <h2>Continuous Deployment</h2>
    <p>This simple HTML page is deployed automatically to an Azure VM using GitHub Actions.</p>
    <button onclick="alert('Deployment successful!')">Click Me</button>
  </section>

  <footer>
    <p>&copy; 2026 My Demo Site</p>
  </footer>
</body>
</html>
